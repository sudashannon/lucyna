<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucyna · 动画预览</title><style>
:root{font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif;color:#292d30;background:#f8f8f5;--card:#fff;--line:#e1e4df;--muted:#69716f}*{box-sizing:border-box}body{margin:0;padding:42px 5vw}body.dark{background:#171d21;color:#eef1eb;--card:#242c30;--line:#3a464b;--muted:#a4b5b7}header{max-width:1060px;margin:auto}small{font-size:11px;letter-spacing:.14em;color:var(--muted)}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}p{color:var(--muted);margin:4px 0 22px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 18px;cursor:pointer}button[aria-pressed=true]{background:#14757a;color:white;border-color:#14757a}main{max-width:1060px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:auto}.card{border:1px solid var(--line);border-radius:20px;background:var(--card);overflow:hidden;padding:14px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}h2{font-size:15px;margin:2px 0}.card p{font-size:12px;margin:0}footer{max-width:1060px;margin:26px auto 0;color:var(--muted);font-size:12px}@media(max-width:740px){main{grid-template-columns:repeat(2,minmax(0,1fr))}body{padding:22px}}
</style></head><body><header><small>LUCYNA / PIXEL COMPANION</small><h1>一起工作，也有自己的小动作。</h1><p>同一套角色，四种状态。画面直接播放客户端使用的逐帧素材。</p><nav><button id="duo" aria-pressed="true">女孩与黑猫</button><button id="cat" aria-pressed="false">只看黑猫</button><button id="pause" aria-pressed="false">暂停动画</button><button id="theme" aria-pressed="false">深色背景</button></nav></header><main>
<section class="card"><canvas data-clip="idle" width="260" height="260"></canvas><h2>待机 · 眨眼</h2><p>安静陪伴，偶尔眨眼和摇尾巴。</p></section>
<section class="card"><canvas data-clip="working" width="260" height="260"></canvas><h2>工作 · 操作终端</h2><p>跟随 OMP 的运行与思考状态。</p></section>
<section class="card"><canvas data-clip="attention" width="260" height="260"></canvas><h2>待办 · 招手</h2><p>有问题等你回答，点击回到会话。</p></section>
<section class="card"><canvas data-clip="completed" width="260" height="260"></canvas><h2>完成 · 庆祝</h2><p>客户端中短暂庆祝后回到待机。</p></section>
</main><footer>预览中的完成动作循环演示。正式客户端只在任务真正完成时播放；停止不会触发庆祝。静态版本保留，可随时切回。</footer><script src="../../src/pet/animation-data.js"></script><script src="../../src/pet/animation.js"></script><script>
let appearance='duo',paused=false,origin=performance.now(),timer,revision=0;const images={},cards=[...document.querySelectorAll('canvas')];
function load(name){if(!images[name])images[name]=new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src='../../src/pet/'+CindyPetAtlas[name].file;});return images[name];}
async function render(){clearTimeout(timer);const rev=++revision,image=await load(appearance);if(rev!==revision)return;const atlas=CindyPetAtlas[appearance],elapsed=performance.now()-origin;let next=500;
for(const canvas of cards){const clip=canvas.dataset.clip,at=clip==='completed'?elapsed%5000:elapsed,frame=CindyPetAnimation.sample(clip,at,paused||document.hidden);const {source:s,image:r}=CindyPetAnimation.placement(atlas,frame.frame,260,260),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,260,260);ctx.drawImage(image,s.x,s.y,s.width,s.height,r.x,r.y,r.width,r.height);next=Math.min(next,frame.delay||500);canvas.dataset.frame=frame.frame;}if(!paused&&!document.hidden)timer=setTimeout(render,Math.max(30,next));}
for(const name of ['duo','cat'])document.getElementById(name).onclick=()=>{appearance=name;origin=performance.now();for(const x of ['duo','cat'])document.getElementById(x).setAttribute('aria-pressed',String(x===name));render();};
document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'继续动画':'暂停动画';e.currentTarget.setAttribute('aria-pressed',String(paused));render();};document.getElementById('theme').onclick=e=>{e.currentTarget.setAttribute('aria-pressed',String(document.body.classList.toggle('dark')));};document.addEventListener('visibilitychange',render);render();
</script></body></html>
